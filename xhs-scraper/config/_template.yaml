# ============================================================================
# 小红书评论采集工具包 · 类目配置【空白模板】
# ----------------------------------------------------------------------------
# 想采一个新类目（比如「面膜」）：
#   1) 把本文件复制成 config/面膜.yaml
#   2) 照下面 <尖括号> 的地方填 —— 只有 6 处
#   3) 跑：python run_all.py --cat 面膜
#
# ★ 填不出来的先留空数组 []，脚本不会崩，只是那部分数据为空。
#   最省事的做法：先只填 keywords 跑一轮采集，看看抓回来的东西长什么样，
#   再回头补 category.words（品类词）和 buckets（统计口径）。
# ============================================================================

project:
  name: <类目中文名，如：面膜>
  catKey: <英文短名，如：mask>            # 只用来做内部标识
  # 相对路径 = 落在「xhs-scraper/产出/<目录名>」下（推荐，换机器不用改）
  outputDir: ./产出/<改成你的目录名>
  session: xhs-<英文短名>-research

doc:
  title: <类目中文名> · 小红书评论汇总
  path: <类目路径，如：个护家清 / 面部护理 / 面膜>
  subtitle: 数据源：小红书公开笔记与评论

# ---- ① 品类词：评论里出现任意一个 → 算「和本类目强相关」，予以保留
category:
  words: []
  #   - 面膜
  #   - 敷面膜
  #   - 补水
  #   - 精华液

  # ---- ② 品牌词：命中也算相关（留住"只提牌子没提品类"的评论）
  brands: []
  #   - 某某品牌

  # ---- ③ 噪音词：标题里出现 → 直接丢掉（关键词误命中）
  noise: []
  #   - 宠物
  #   - 家电

# ---- ④ 搜索关键词：[关键词, 标签]。tag 只做展示分类，填：综合/求安利/吐槽/测评/需求/痛点
keywords: []
#  - [面膜, 综合]
#  - [面膜避雷, 吐槽]
#  - [面膜推荐, 求安利]
#  - [面膜测评, 测评]
#  - [补水面膜, 需求]

collect:
  links:
    scrollTo: [1500, 3000, 4500]
    scrollWait: 1.8
    perKeywordCap: 40
    navWait: 6
  notes:
    rounds: 2
    scrollTo: [900, 1800, 2700, 3600, 4500, 6000, 7500]
    maxComments: 120
    navWait: 5
    gap: 1.2

# ---- ⑤ 统计口径：需求桶 / 痛点桶
# 需求桶 = 用户「想要什么」；痛点桶 = 用户「踩了什么坑」，全部走否定识别。
# 格式：[桶名, '正则']（正则里 | 表示"或"，建议用 5-20 个词覆盖一个维度）
buckets:
  needs: []
  #  - [功效诉求（补水/保湿）, '补水|保湿|水润|不干|滋润']
  #  - [价格性价比, '平价|便宜|性价比|学生|划算']

  pains: []
  #  - [过敏 / 刺痛 / 泛红, '过敏|泛红|刺痛|灼热|痒|红肿|烂脸']
  #  - [无效 / 智商税, '(?<!有)没效果|无效|智商税|后悔|踩雷|不值']

decisionMap: {}
#  功效诉求（补水/保湿）: 功效
#  价格性价比: 价格

nonFixable: [物流, 快递, 发货, 客服态度, 服务态度, 退货, 退款, 退不了, 降价]

# ---- ⑥ 筛选：教程类剔除 + 高价值加权
pick:
  tutorial: '手法|教程|跟练|小课堂|步骤|教学|示范|演示'
  high: '避雷|避坑|别买|千万别|后悔|智商税|翻车|吐槽|踩雷|没用|无效|难用|差评|空瓶|用完|用了|感受|体验|实测|测评|对比|真实|亲测|回购|求推荐|哪个好|怎么样|过敏|刺痛|泛红|烂脸|闷痘'
  blankTemplate: true
  tagBonus: [吐槽, 测评, 求安利]

filter:
  R1_营销文本: '加V|加薇|加微|私信|点我头像|点击主页|主页联系|淘口令|淘宝|天猫|京东|拼多多|http[s]?://|www\.|优惠券|领券|链接在|低价出|代购|代拍|返现|返利|刷单|接广告|互关|互赞|涨粉|引流|货源|一手价|批发'
  R7_营销昵称: '好物|优选|严选|福利|返利|优惠券|折扣|代购|旗舰店|官方旗舰|客服|批发|厂家|工厂|清仓|特卖|团购|带货|甄选'
  R9_不可改良: '太贵|价格.*贵|物流|快递|发货|包装|瓶口|按压.*难|盖.*松'
  R12_购买引导: '(?<![a-zA-Z])tao(?![a-zA-Z])|去某宝|某宝|置顶评论|戳我|私我|主页有|点击主页'
  maxLen: 300
  r4CrossNotes: 3
  r5IpHitRate: 0.4
  r5MinCount: 5
  r6HourBurst: 8

output:
  writeMd: true
  writeHtml: true
  maxPerNote: 120
