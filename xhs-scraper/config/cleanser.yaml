# ============================================================================
# 小红书评论采集工具包 · 类目配置
# ----------------------------------------------------------------------------
# 这是【唯一需要改的文件】。换一个类目 = 复制本文件改名，然后改下面几处：
#   1) project.name / outputDir / session
#   2) category.*          —— 品类词、品牌词、噪音词（决定"这条评论算不算相关"）
#   3) keywords            —— 搜索关键词（决定"能搜到哪些笔记"）
#   4) buckets.needs / buckets.pains + decisionMap  —— 统计口径
#   5) doc.title           —— 产出文档标题
# 改完直接跑：python run_all.py --cat <你的文件名去掉.yaml>
# ============================================================================

project:
  name: 洁面（洗面奶）
  catKey: cleanser
  # ★ 产出目录：raw / data / 汇总文档都会落在这里。
  #   相对路径 = 落在「xhs-scraper/产出/」下（推荐，换机器不用改）；
  #   也可以填任意绝对路径，如 D:/我的项目/洁面
  outputDir: ./产出/洁面
  # 每个类目一个独立 session，避免和别的类目抢同一个浏览器标签
  session: xhs-cleanser-research

doc:
  title: 洗面奶 · 小红书评论汇总
  # 类目路径（写完在文档副标题上）
  path: 个护家清 / 面部护理 / 洁面（洗面奶）
  subtitle: 数据源：小红书公开笔记与评论

