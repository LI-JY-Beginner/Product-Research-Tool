# ---------------------------------------------------------------- 搜索关键词
# 20 组左右为宜：综合 + 求安利 + 吐槽 + 测评 + 各肤质需求 + 使用痛点。
# tag 只用于产出文档里做归类展示，不影响采集。
keywords:
  - [洗面奶, 综合]
  - [洗面奶推荐, 求安利]
  - [洗面奶避雷, 吐槽]
  - [洗面奶测评, 测评]
  - [洗面奶 平价, 需求]
  - [洗面奶 学生, 需求]
  - [氨基酸洗面奶, 需求]
  - [洗面奶 油皮, 需求]
  - [洗面奶 干皮, 需求]
  - [洗面奶 敏感肌, 需求]
  - [洗面奶 痘肌, 需求]
  - [洗面奶 智商税, 吐槽]
  - [洗面奶 紧绷, 痛点]
  - [洗面奶 假滑, 痛点]
  - [洗面奶 黑头, 需求]
  - [洁面推荐, 求安利]
  - [洁面 测评, 测评]
  - [洗面奶 空瓶, 需求]
  - [洗面奶 翻车, 吐槽]
  - [男士洗面奶, 需求]

# ---------------------------------------------------------------- 采集参数
collect:
  links:
    scrollTo: [1500, 3000, 4500]     # 搜索页滚到这些 y 坐标，每屏多拿几条
    scrollWait: 1.8
    perKeywordCap: 40                # 每个关键词最多取多少条
    navWait: 6                       # 打开搜索页后等多久
  notes:
    rounds: 2                        # 「展开回复 + 下滑」重复几轮
    scrollTo: [900, 1800, 2700, 3600, 4500, 6000, 7500]
    maxComments: 120                 # 每篇最多抓多少条评论
    navWait: 5
    gap: 1.2                         # 两篇之间歇一下，太密会被限流

# ---------------------------------------------------------------- 统计口径
buckets:
  # 需求桶：用户"想要什么"。按顺序匹配，一条语料只进第一个命中的桶。
  needs:
    - [清洁力（洗得干净/控油/去黑头）, '清洁力|洗得干净|洗干净|洗得掉|洗掉|去油|控油|黑头|白头|毛孔|油脂|脏东西|深层清洁|卸得掉|洗完很干净']
    - [洗后肤感（不紧绷/不假滑/不拔干）, '紧绷|拔干|干涩|假滑|洗后|洗完|保湿|水润|舒服|清爽|不干|不涩|滋润|肤感|滑']
    - [成分安全（氨基酸/无皂基/无香精）, '氨基酸|皂基|成分|无香精|香精|酒精|sls|表活|弱酸|ph值|ph|防腐剂|无添加|安全|温和配方|刺激']
    - [肤质匹配（油皮/干皮/敏感肌/痘肌）, '油皮|干皮|混油|混干|混合皮|敏感肌|痘肌|痘痘肌|大油田|沙漠皮|肤质|中性皮']
    - [祛痘 / 去闭口功效, '祛痘|去痘|消痘|闭口|粉刺|痘痘|痘印|抗炎|消炎|红肿|痘']
    - [价格性价比（平价/学生党）, '平价|便宜|性价比|学生|穷鬼|大碗|百元|实惠|划算|预算|不贵|价位|多少钱|一支能用|几十块']
    - [泡沫与使用愉悦感, '泡沫|泡泡|绵密|丰富|起泡|打泡|冲洗|好冲|香味|味道|好闻|难闻|气味|香精味|留香|仪式感']
    - [选品求助（求推荐/哪个好）, '用哪个|推荐吗|求推荐|求安利|哪个好|可以吗|适合吗|怎么选|怎么办|用哪种|哪款|怎么样|有用过的吗|求分享']
    - [用法/搭配困惑（频率/干手干脸/二次清洁）, '一天洗几次|早晚|频率|干手|干脸|打湿|二次清洁|先用|顺序|要不要|还要用|搭配|卸妆后|敷']

  # 痛点桶：用户"踩了什么坑"。全部走否定识别 ——
  # 「不紧绷」「不假滑」不会被算成痛点（否则数据会失真）。
  pains:
    - [洗后紧绷 / 拔干, '紧绷|拔干|干涩|很干|脸干|干燥|起皮|脱皮|绷得|绷']
    - [假滑 / 残留冲不净, '假滑|滑腻|冲不干净|洗不干净|残留|膜感|没洗干净|洗不掉|洗完还是油|油膜']
    - [过敏 / 刺痛 / 泛红 / 烂脸, '过敏|泛红|发红|刺痛|灼热|辣眼睛|辣脸|瘙痒|很痒|又痒|肿|红疹|起疹|烂脸|烧灼|烫|不适']
    - [致痘 / 闷痘 / 爆闭口, '闷痘|致痘|长痘|爆痘|闭口|粉刺|起痘|冒痘|越长越多']
    - [清洁力不足 / 洗不干净, '清洁力不够|清洁力不行|洗不干净|洗不掉|清洁力弱|卸不干净|没洗干净|卸不掉|清洁力差']
    - [过度清洁 / 伤屏障, '过度清洁|清洁力太强|清洁力太猛|伤屏障|屏障受损|越洗越油|越洗越干|洗太干净']
    - [气味难闻 / 香精味重, '难闻|异味|刺鼻|呛|味儿|味道怪|香精味|味道太冲|化工味']
    - [无效 / 智商税, '(?<!有)没效果|(?<!有)没有效果|没啥效果|一点效果没有|不见效|没见效|无效|智商税|交智商税|后悔|骗子|骗人|踩雷|不值|白买|吹上天|(?<!有)(?<!还)没用(?!完|之前|以前|过)|没啥用|浪费钱|交税']
    - [包装 / 膏体问题, '挤不出来|挤不动|太硬|硬得|不好挤|难起泡|起不了泡|漏|盖不严|盖子松|开口太|膏体']

# 决策权重：需求桶 → 用户实际决策时的评判维度（多个桶可合并到同一维度，权重会相加）
decisionMap:
  清洁力（洗得干净/控油/去黑头）: 清洁力
  洗后肤感（不紧绷/不假滑/不拔干）: 温和度（不紧绷）
  成分安全（氨基酸/无皂基/无香精）: 成分安全
  肤质匹配（油皮/干皮/敏感肌/痘肌）: 肤质匹配
  祛痘 / 去闭口功效: 功效（祛痘/去黑头）
  价格性价比（平价/学生党）: 价格
  泡沫与使用愉悦感: 使用感（泡沫/香味）

# 不可改良项：命中这些的语料不进痛点榜（物流/客服/价格类差评改了也没用）
nonFixable: [物流, 快递, 发货, 客服态度, 服务态度, 退货, 退款, 退不了, 降价]

# ---------------------------------------------------------------- 筛选与过滤
pick:
  # 纯教程/手法类 → 排除，对"为什么买"挖掘价值低
  tutorial: '手法|教程|跟练|小课堂|正确使用方法|按摩|穴位|步骤|教学|示范|演示|正确洗脸|洗脸步骤|洗脸方式|怎么洗脸|洗脸教学'
  # 高价值信号 → 加权
  high: '避雷|避坑|别买|千万别|后悔|智商税|翻车|吐槽|踩雷|没用|无效|难用|差评|空瓶|用完|用了|感受|体验|实测|测评|对比|真实|亲测|回购|求推荐|哪个好|用哪个|怎么样|可以吗|推荐|平价|学生|过敏|紧绷|假滑|干涩|刺痛|泛红|爆痘|闷痘|闭口|黑头|清洁力|洗不干净|清洁力太强|香精|味道|难闻|油皮|干皮|敏感肌|痘肌|混油|混干'
  blankTemplate: true   # true = 品牌加分直接用 category.brands，不用另填
  # 类型加分：这几个 tag 的笔记真实反馈密度最高
  tagBonus: [吐槽, 测评, 求安利]

# 过滤规则 R1-R12（水军/营销/无关内容剔除）
filter:
  R1_营销文本: '加V|加薇|加微|私信|点我头像|点击主页|主页联系|淘口令|淘宝|天猫|京东|拼多多|http[s]?://|www\.|优惠券|领券|链接在|低价出|代购|代拍|返现|返利|刷单|接广告|互关|互赞|涨粉|引流|货源|一手价|批发'
  R7_营销昵称: '好物|优选|严选|福利|返利|优惠券|折扣|代购|旗舰店|官方旗舰|客服|批发|厂家|工厂|清仓|特卖|团购|带货|甄选'
  R9_不可改良: '太贵|价格.*贵|物流|快递|发货|包装|瓶口|按压.*难|盖.*松'
  R12_购买引导: '(?<![a-zA-Z])tao(?![a-zA-Z])|去某宝|某宝|置顶评论|戳我|私我|主页有|点击主页'
  maxLen: 300            # 单条语料超过这个长度截断
  r4CrossNotes: 3        # 同文案出现在 >=N 个不同笔记 → 判为复刷
  r5IpHitRate: 0.4       # 同一属地占比超过该值且条数 >= r5MinCount → 判为水军聚集
  r5MinCount: 5
  r6HourBurst: 8         # 同笔记同一小时零赞评论 >=N 条 → 整簇剔除

# ---------------------------------------------------------------- 输出
output:
  writeMd: true
  writeHtml: true
  # 汇总文档里每篇笔记最多列多少条语料（太多会让文档过大）
  maxPerNote: 120
