    - [卫生/包装设计差, '漏|不卫生|卫生隐患|二次污染|难打开|打不开|包装差|包装简陋|包装不好|包装太|瓶口太|盖不严|盖子松|滴管不好|取量不|控制不了用量|一次挤太多|洒了']

