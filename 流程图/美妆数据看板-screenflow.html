<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美妆数据看板 · 交互流程图</title>
<style>
  :root {
    --pm-accent: #5b5bd6;
    --ink: #30285b;
    --line: #8d82b1;
    --soft: #cbc4e7;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body {
    background:#f8f8fc;
    font-family:'Microsoft YaHei','PingFang SC',sans-serif;
    color:var(--ink);
  }

  /* ---------- 顶部工具栏 ---------- */
  .toolbar {
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:flex; align-items:center; gap:14px;
    padding:10px 18px;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid #eceaf5;
  }
  .toolbar h1 { font-size:16px; font-weight:700; color:var(--pm-accent); white-space:nowrap; }
  .toolbar .hint { font-size:12px; color:#8d82b1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .spacer { flex:1; }
  .btn {
    border:1.5px solid var(--soft); background:#faf9ff; color:var(--ink);
    font-size:13px; padding:5px 12px; border-radius:8px; cursor:pointer;
    font-family:inherit;
  }
  .btn:hover { border-color:var(--pm-accent); color:var(--pm-accent); }
  .zoom-level { font-size:12.5px; color:#8d82b1; min-width:44px; text-align:center; }

  /* ---------- 图例 ---------- */
  .legend {
    position:fixed; left:18px; bottom:18px; z-index:100;
    background:rgba(255,255,255,.94); border:1px solid #eceaf5;
    border-radius:12px; padding:12px 16px;
    font-size:12px; color:#6f65a3; line-height:2;
    box-shadow:0 2px 12px rgba(48,40,91,.08);
  }
  .legend b { color:var(--ink); font-size:12.5px; }
  .lg-row { display:flex; align-items:center; gap:8px; }
  .lg-node { width:26px; height:16px; border:1.5px solid var(--soft); background:#faf9ff; border-radius:3px; display:inline-block; }
  .lg-node.cur { border-color:var(--pm-accent); box-shadow:0 0 0 3px rgba(91,91,214,.18); }
  .lg-arrow { color:var(--line); font-size:14px; }

  /* ---------- 画布 ---------- */
  #viewport { position:fixed; inset:0; cursor:grab; }
  #viewport.dragging { cursor:grabbing; }
  #world { position:absolute; top:0; left:0; transform-origin:0 0; }

  #wires { position:absolute; top:0; left:0; overflow:visible; pointer-events:none; }
  #wires path { fill:none; stroke:var(--line); stroke-width:2.5; }

  /* ---------- 节点卡片 ---------- */
  .node {
    position:absolute;
    background:#fff; border:2px solid var(--soft); border-radius:12px;
    box-shadow:0 3px 14px rgba(48,40,91,.10);
    display:flex; flex-direction:column; overflow:hidden;
    transition:box-shadow .15s;
  }
  .node:hover { box-shadow:0 5px 20px rgba(91,91,214,.22); border-color:var(--pm-accent); }
  .node-head {
    height:32px; flex:none; display:flex; align-items:center; gap:8px;
    padding:0 12px; background:#faf9ff; border-bottom:1px solid #eceaf5;
    font-size:12.5px; font-weight:600; color:var(--ink);
  }
  .node-head .dot { width:8px; height:8px; border-radius:50%; background:var(--pm-accent); flex:none; }
  .node-head .idx {
    flex:none; font-size:11px; color:#fff; background:var(--pm-accent);
    border-radius:6px; padding:1px 7px; margin-left:auto;
  }
  .node-frame { position:relative; flex:1; overflow:hidden; background:#fff; }
  .node-frame iframe {
    position:absolute; top:0; left:50%;
    width:1634px; height:900px; border:0;
    transform:translateX(-50%) scale(0.2644); transform-origin:50% 0;
    pointer-events:none;
  }
  .node-load {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:12px; color:#8d82b1; background:#faf9ff; z-index:-1;
  }

  /* ---------- 连线标签 ---------- */
  .edge-label {
    position:absolute; transform:translate(-50%,-50%);
    background:var(--pm-accent); color:#fff;
    font-size:11.5px; line-height:1; padding:5px 10px;
    border-radius:999px; white-space:nowrap;
    box-shadow:0 2px 6px rgba(91,91,214,.35);
    pointer-events:none;
  }
  .edge-label.mutual { background:#fff; color:var(--pm-accent); border:1.5px solid var(--pm-accent); box-shadow:none; }
</style>
</head>
<body>

<div class="toolbar">
  <h1>美妆数据看板 · 交互流程图</h1>
  <span class="hint">7 个原型页实时引用（原型改动自动同步），箭头为页面跳转链路 · 拖拽空白处平移，滚轮缩放</span>
  <div class="spacer"></div>
  <button class="btn" id="zoomOut">−</button>
  <span class="zoom-level" id="zoomLevel">100%</span>
  <button class="btn" id="zoomIn">＋</button>
  <button class="btn" id="zoomFit">适应画布</button>
</div>

<div class="legend">
  <b>图例</b>
  <div class="lg-row"><span class="lg-node"></span> 原型页面（缩放 iframe 实时引用）</div>
  <div class="lg-row"><span class="lg-arrow">→</span> 单向跳转（带操作标签）</div>
  <div class="lg-row"><span class="lg-arrow">↔</span> 并列互切（看板内 tab 切换）</div>
</div>

<div id="viewport">
  <div id="world">
    <svg id="wires">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 Z" fill="#8d82b1"></path>
        </marker>
      </defs>
      <g id="wirePaths"></g>
    </svg>
    <div id="labels"></div>
    <div id="nodes"></div>
  </div>
</div>

<script>
/* ================= 布局常量 ================= */
var PROTO = '../原型/美妆数据看板-prototype.html';
var IFW = 1440, IFH = 900;      // iframe 内部设计尺寸
var SCALE = 0.30;               // 缩放比例
var NW = 432, NH = 270;         // 节点可视尺寸
var HEAD = 32;
var FRAME_H = NH - HEAD;        // 238
var FS = FRAME_H / IFH;         // 实际应用缩放 ≈ 0.2644（以高度为准，宽度居中裁切）

/* 节点：世界坐标（行距 320，保证并列互切双线 + 标签不挤压） */
var NODES = [
  { id:'global-growth',           name:'增速产品看板',   tag:'全球看板', x:40,   y:60  },
  { id:'global-category-trend',   name:'类目增长趋势',   tag:'全球看板', x:40,   y:380 },
  { id:'global-ingredient-rank',  name:'成分增长榜',     tag:'全球看板', x:40,   y:700 },
  { id:'ingredient-lib',          name:'成分库',         tag:'成分库',   x:760,  y:700 },
  { id:'product-rank',            name:'商品榜',         tag:'榜单',     x:1480, y:60  },
  { id:'strategy-cards',          name:'机会结论卡片',   tag:'策略输出', x:2200, y:380 },
  { id:'strategy-market-size',    name:'市场规模',       tag:'策略验证', x:2920, y:380 }
];
var byId = {};
NODES.forEach(function(n){ byId[n.id] = n; });

/* 边：type mutual = 双向并列 */
var EDGES = [
  { a:'global-growth',          b:'global-category-trend',  type:'mutual', label:'并列互切', labelSide:'right' },
  { a:'global-category-trend',  b:'global-ingredient-rank', type:'mutual', label:'并列互切', labelSide:'left' },
  { a:'global-category-trend',  b:'global-ingredient-rank', type:'oneway', label:'看成分', offset:34 },
  { a:'global-ingredient-rank', b:'ingredient-lib',         type:'oneway', label:'' },
  { a:'global-growth',          b:'product-rank',           type:'oneway', label:'看全量榜单' },
  { a:'product-rank',           b:'strategy-cards',         type:'oneway', label:'选出机会品' },
  { a:'ingredient-lib',         b:'strategy-cards',         type:'oneway', label:'' },
  { a:'strategy-cards',         b:'strategy-market-size',   type:'oneway', label:'验证市场体量' }
];

/* ================= 渲染节点 ================= */
var nodesEl = document.getElementById('nodes');
NODES.forEach(function(n, i){
  var d = document.createElement('div');
  d.className = 'node';
  d.id = 'node-' + n.id;
  d.style.cssText = 'left:' + n.x + 'px;top:' + n.y + 'px;width:' + NW + 'px;height:' + NH + 'px;';
  d.innerHTML =
    '<div class="node-head"><span class="dot"></span>' + n.name +
    '<span class="idx">' + (i+1) + ' · ' + n.tag + '</span></div>' +
    '<div class="node-frame">' +
      '<div class="node-load">加载原型页…</div>' +
      '<iframe src="' + PROTO + '#' + n.id + '" scrolling="no"></iframe>' +
    '</div>';
  nodesEl.appendChild(d);
});

/* ================= Manhattan 连线 ================= */
function edgeGeom(e){
  var A = byId[e.a], B = byId[e.b];
  var ax = A.x, ay = A.y, bx = B.x, by = B.y;
  var aR = ax + NW, aL = ax, aT = ay, aB = ay + NH, aCx = ax + NW/2, aCy = ay + NH/2;
  var bR = bx + NW, bL = bx, bT = by, bB = by + NH, bCx = bx + NW/2, bCy = by + NH/2;

  /* 垂直相邻（同列，上下排列） */
  if (Math.abs(aCx - bCx) < 1) {
    if (bT > aB) { /* A 在上 */
      var my = (aB + bT) / 2;
      if (e.type === 'mutual') {
        var x1 = aCx - 12, x2 = aCx + 12;
        /* 标签放在双线外侧，避免压线 */
        var lx = e.labelSide === 'left' ? x1 - 34 : x2 + 34;
        return { segs: [
          ['M',x1,aB,'L',x1,bT],
          ['M',x2,bT,'L',x2,aB]
        ], arrows:[1,1], label:[lx, my] };
      }
      /* oneway 同列：可带横向偏移，避开并列双线 */
      var off = e.offset || 0;
      return { segs: [['M',aCx+off,aB,'L',aCx+off,bT]], arrows:[1], label:[aCx+off+40, my] };
    }
  }
  /* 水平相邻（同行，左右排列） */
  if (Math.abs(aCy - bCy) < 1 && bL > aR) {
    var mx = (aR + bL) / 2;
    return { segs: [['M',aR,aCy,'L',mx,aCy,'L',mx,bCy,'L',bL,bCy]], arrows:[1], label:[mx, aCy] };
  }
  /* 通用直角：从 A 右出 → 中点 x → B 侧入 */
  if (bL > aR) {
    var mx2 = (aR + bL) / 2;
    return { segs: [['M',aR,aCy,'L',mx2,aCy,'L',mx2,bCy,'L',bL,bCy]], arrows:[1],
             label:[mx2, (aCy + bCy)/2] };
  }
  if (bB < aT) { /* B 在上方 */
    var my2 = (aT + bB) / 2;
    return { segs: [['M',aCx,aT,'L',aCx,my2,'L',bCx,my2,'L',bCx,bB]], arrows:[1],
             label:[(aCx+bCx)/2, my2] };
  }
  return null;
}

var wireG = document.getElementById('wirePaths');
var labelsEl = document.getElementById('labels');
var NS = 'http://www.w3.org/2000/svg';

function drawWires(){
  wireG.innerHTML = '';
  labelsEl.innerHTML = '';
  var maxX = 0, maxY = 0;

  EDGES.forEach(function(e){
    var g = edgeGeom(e);
    if (!g) return;
    g.segs.forEach(function(s, i){
      var p = document.createElementNS(NS, 'path');
      var dstr = '';
      for (var k = 0; k < s.length; k += 3) {
        dstr += s[k] + s[k+1] + ',' + s[k+2] + ' ';
      }
      p.setAttribute('d', dstr.trim());
      if (g.arrows[i]) p.setAttribute('marker-end', 'url(#arrow)');
      if (e.type === 'mutual') p.setAttribute('stroke-dasharray', '0');
      wireG.appendChild(p);
    });
    if (e.label) {
      var lb = document.createElement('div');
      lb.className = 'edge-label' + (e.type === 'mutual' ? ' mutual' : '');
      lb.textContent = e.label;
      lb.style.left = g.label[0] + 'px';
      lb.style.top = g.label[1] + 'px';
      labelsEl.appendChild(lb);
    }
  });

  NODES.forEach(function(n){
    maxX = Math.max(maxX, n.x + NW);
    maxY = Math.max(maxY, n.y + NH);
  });
  var wires = document.getElementById('wires');
  wires.setAttribute('width', maxX + 120);
  wires.setAttribute('height', maxY + 120);
}

/* ================= 平移 / 缩放 ================= */
var world = document.getElementById('world');
var viewport = document.getElementById('viewport');
var tx = 60, ty = 70, scale = 1;

function apply(){
  world.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
  document.getElementById('zoomLevel').textContent = Math.round(scale * 100) + '%';
}
function fit(){
  var maxX = 0, maxY = 0;
  NODES.forEach(function(n){ maxX = Math.max(maxX, n.x + NW); maxY = Math.max(maxY, n.y + NH); });
  var vw = window.innerWidth, vh = window.innerHeight;
  scale = Math.min((vw - 80) / (maxX + 40), (vh - 140) / (maxY + 40), 1);
  tx = (vw - (maxX + 40) * scale) / 2;
  ty = 64 + (vh - 64 - (maxY + 40) * scale) / 2;
  apply();
}
document.getElementById('zoomIn').onclick = function(){ scale = Math.min(scale * 1.15, 3); apply(); };
document.getElementById('zoomOut').onclick = function(){ scale = Math.max(scale / 1.15, 0.1); apply(); };
document.getElementById('zoomFit').onclick = fit;

var dragging = false, sx = 0, sy = 0, stx = 0, sty = 0;
viewport.addEventListener('mousedown', function(e){
  if (e.target.closest('.btn')) return;
  dragging = true; viewport.classList.add('dragging');
  sx = e.clientX; sy = e.clientY; stx = tx; sty = ty;
});
window.addEventListener('mousemove', function(e){
  if (!dragging) return;
  tx = stx + (e.clientX - sx); ty = sty + (e.clientY - sy); apply();
});
window.addEventListener('mouseup', function(){ dragging = false; viewport.classList.remove('dragging'); });
viewport.addEventListener('wheel', function(e){
  e.preventDefault();
  var old = scale;
  scale = Math.min(Math.max(scale * (e.deltaY < 0 ? 1.08 : 0.93), 0.1), 3);
  tx = e.clientX - (e.clientX - tx) * (scale / old);
  ty = e.clientY - (e.clientY - ty) * (scale / old);
  apply();
}, { passive:false });

window.addEventListener('resize', function(){ /* 保持用户视角 */ });

drawWires();
fit();
</script>
</body>
</html>
