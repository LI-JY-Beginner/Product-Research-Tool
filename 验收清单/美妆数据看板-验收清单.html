<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美妆数据看板 · 功能验收清单 v0.2</title>
<style>
:root{
  --bg:#f7f7f5;
  --card:#ffffff;
  --ink:#1f2329;
  --ink-2:#4b5563;
  --ink-3:#8a8f98;
  --line:#e7e5e0;
  --line-soft:#efede8;
  --accent:#4f46e5;
  --accent-soft:#eef0ff;
  --green:#16a34a;
  --green-soft:#eaf7ee;
  --red:#dc2626;
  --red-soft:#fbeaea;
  --amber:#d97706;
  --amber-soft:#fdf3e3;
  --skip:#6b7280;
  --skip-soft:#f0f1f3;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  font-size:14px;line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px;margin:0 auto;padding:28px 28px 140px}

/* ===== 顶部悬浮进度 ===== */
.progress-sticky{
  position:sticky;top:0;z-index:100;
  background:rgba(247,247,245,.92);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
  padding:14px 28px 12px;
  margin:0 -28px 24px;
}
.progress-meta{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.progress-title{font-size:13px;color:var(--ink-2);font-weight:600}
.progress-title b{color:var(--ink);font-size:14px}
.progress-stats{display:flex;gap:14px;font-size:12.5px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.total{background:#94a3b8}
.dot.done{background:var(--green)}
.dot.fail{background:var(--red)}
.dot.skip{background:var(--skip)}
.dot.pend{background:#d1d5db}
.progress-bar{height:6px;background:#e8e6e0;border-radius:999px;margin-top:10px;overflow:hidden;display:flex}
.progress-bar i{display:block;height:100%;transition:width .25s}
.progress-bar i.b-done{background:var(--green)}
.progress-bar i.b-fail{background:var(--red)}
.progress-bar i.b-skip{background:#9ca3af}

/* ===== 头部 ===== */
header h1{font-size:26px;font-weight:800;margin:0 0 6px;letter-spacing:-0.02em}
header .sub{color:var(--ink-3);font-size:13px;margin:0 0 20px}
header .sub code{background:#eeece6;padding:1px 6px;border-radius:4px;font-size:12px}

/* ===== 筛选工具条 ===== */
.toolbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;margin-bottom:22px;
  box-shadow:0 1px 2px rgba(16,16,20,.03);
}
.toolbar .label{font-size:12px;color:var(--ink-3);font-weight:600;margin-right:2px}
.seg{display:inline-flex;background:#f0efe9;border-radius:9px;padding:3px;gap:2px}
.seg button{
  border:none;background:transparent;color:var(--ink-2);
  padding:5px 12px;border-radius:7px;font-size:13px;cursor:pointer;
  font-family:inherit;transition:background .12s,color .12s;
}
.seg button:hover{color:var(--ink)}
.seg button.active{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(16,16,20,.08)}
.toolbar .spacer{flex:1}
.btn{
  border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:8px;padding:6px 13px;font-size:13px;cursor:pointer;font-family:inherit;
  transition:border-color .12s,background .12s;
}
.btn:hover{border-color:#c9c6bc;background:#fafaf7}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:#4338ca;border-color:#4338ca}

/* ===== 模块分组 ===== */
.module{margin-bottom:18px}
.module-head{
  display:flex;align-items:center;gap:12px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 16px;cursor:pointer;user-select:none;
  transition:background .12s;
}
.module-head:hover{background:#fbfbfa}
.module-head .caret{
  width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;
  color:var(--ink-3);font-size:11px;transition:transform .15s;background:#f0efe9;flex:0 0 auto;
}
.module.collapsed .module-head .caret{transform:rotate(-90deg)}
.module-head .m-title{font-weight:700;font-size:14.5px}
.module-head .m-count{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;display:flex;gap:10px}
.module-head .m-count .c-done{color:var(--green)}
.module-head .m-count .c-fail{color:var(--red)}
.module-body{margin-top:10px;display:flex;flex-direction:column;gap:10px}
.module.collapsed .module-body{display:none}

/* ===== 验收项卡片 ===== */
.item{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;display:flex;gap:14px;align-items:flex-start;
  transition:border-color .12s, box-shadow .12s;
}
.item:hover{border-color:#d6d3c8;box-shadow:0 1px 3px rgba(16,16,20,.04)}
.item.st-done{border-left:3px solid var(--green)}
.item.st-fail{border-left:3px solid var(--red)}
.item.st-skip{border-left:3px solid #9ca3af;opacity:.72}
.item.st-pend{border-left:3px solid var(--line)}

.tri{
  flex:0 0 auto;display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;
  background:#fff;margin-top:1px;
}
.tri button{
  border:none;background:transparent;padding:5px 9px;font-size:14px;cursor:pointer;line-height:1;
  transition:background .1s;font-family:inherit;
}
.tri button:not(:last-child){border-right:1px solid var(--line-soft)}
.tri button.on-done{background:var(--green-soft)}
.tri button.on-fail{background:var(--red-soft)}
.tri button.on-skip{background:var(--skip-soft)}
.tri button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.item-main{flex:1;min-width:0}
.item-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.item-id{font-family:"SF Mono","JetBrains Mono",Menlo,monospace;font-size:11.5px;color:var(--ink-3);background:#f0efe9;padding:1px 7px;border-radius:5px}
.pri{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;letter-spacing:.02em}
.pri.p0{background:#fbeaea;color:#b91c1c}
.pri.p1{background:#fdf3e3;color:#b45309}
.pri.p2{background:#eef0ff;color:#4338ca}
.item-dim{font-size:11px;color:var(--ink-3)}
.item-title{font-weight:650;font-size:14px;margin:2px 0 6px}
.item-expect{font-size:13px;color:var(--ink-2);background:#fafaf7;border:1px solid var(--line-soft);border-radius:8px;padding:8px 11px}
.item-expect .tag{font-size:11px;color:var(--ink-3);font-weight:600;margin-right:6px}

/* ===== 空态 ===== */
.empty{
  text-align:center;color:var(--ink-3);padding:44px 0;font-size:13px;
  background:var(--card);border:1px dashed var(--line);border-radius:12px;
}

/* ===== 底部导出 ===== */
.footer-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:90;
  background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  padding:12px 28px;
}
.footer-inner{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:14px}
.footer-inner .hint{font-size:12.5px;color:var(--ink-3)}
.footer-inner .right{margin-left:auto;display:flex;gap:10px}

/* toast */
.toast{
  position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(8px);
  background:#1f2329;color:#fff;font-size:13px;padding:9px 16px;border-radius:9px;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:200;
  box-shadow:0 8px 24px rgba(0,0,0,.18);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:720px){
  .wrap{padding:20px 16px 140px}
  .progress-sticky{margin:0 -16px 18px;padding:12px 16px 10px}
  .item{flex-direction:column}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="progress-sticky">
    <div class="progress-meta">
      <div class="progress-title">验收进度 <b id="pctText">0%</b> <span id="doneOverTotal" style="color:var(--ink-3);font-weight:400"></span></div>
      <div class="progress-stats">
        <span class="stat"><i class="dot total"></i>总数 <b id="cntTotal">0</b></span>
        <span class="stat"><i class="dot pend"></i>待验收 <b id="cntPend">0</b></span>
        <span class="stat"><i class="dot done"></i>通过 <b id="cntDone">0</b></span>
        <span class="stat"><i class="dot fail"></i>未通过 <b id="cntFail">0</b></span>
        <span class="stat"><i class="dot skip"></i>跳过 <b id="cntSkip">0</b></span>
      </div>
    </div>
    <div class="progress-bar">
      <i class="b-done" id="barDone" style="width:0%"></i>
      <i class="b-fail" id="barFail" style="width:0%"></i>
      <i class="b-skip" id="barSkip" style="width:0%"></i>
    </div>
  </div>

  <header>
    <h1>美妆数据看板 · 功能验收清单</h1>
    <p class="sub">依据 <code>美妆数据看板-PRD.html v0.2</code> 生成 · 覆盖 ①全球数据看板 ②商品榜 ③成分库 ④初始策略台 四大板块 · 进度自动保存于浏览器 localStorage</p>
  </header>

  <div class="toolbar">
    <span class="label">状态筛选</span>
    <div class="seg" id="filterSeg">
      <button data-f="all" class="active">全部</button>
      <button data-f="pend">待验收</button>
      <button data-f="done">通过</button>
      <button data-f="fail">未通过</button>
      <button data-f="skip">跳过</button>
    </div>
    <span class="spacer"></span>
    <button class="btn" id="expandAll">全部展开</button>
    <button class="btn" id="collapseAll">全部折叠</button>
    <button class="btn" id="resetBtn">清空进度</button>
  </div>

  <main id="modules"></main>

</div>

<div class="footer-bar">
  <div class="footer-inner">
    <span class="hint" id="saveHint">进度已自动保存</span>
    <div class="right">
      <button class="btn primary" id="exportBtn">⬇ 一键导出验收报告（txt）</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= 数据：验收项 =================
 * state: pend(待验收) / done(通过) / fail(未通过) / skip(跳过)
 * 字段：id / dim(维度) / pri(P0/P1/P2) / title(验收内容) / expect(预期结果)
 */
var MODULES = [
{
  key:"m1", name:"① 全球数据看板",
  items:[
    // ---- 1.1 增速产品看板 ----
    {id:"1.1-01", dim:"核心流程", pri:"P0", title:"「自用密度模式 / 路演结论模式」顶部视图开关可切换，默认进入为自用密度模式", expect:"打开页面默认是自用密度模式；点击开关整页切换为结论卡片视图，同一份数据不重抓"},
    {id:"1.1-02", dim:"核心流程", pri:"P0", title:"自用结论板块置顶展示：七天内增速最快产品（商品名+主图）+ GMV 增速 + 销售国家 + 销售价格（带货币符号）", expect:"两种模式下均置顶、大字号卡片；四要素齐全；货币符号随市场切换（国内 ¥ / 海外 $）"},
    {id:"1.1-03", dim:"核心流程", pri:"P0", title:"筛选条「市场 + 品类」级联：品类从一级（个护家清）→ 二级（个人护理）→ 三级（面部洗护 / 眼部护理级）逐级展开", expect:"hover/点击逐级展开，选择三级类目后下方分组区同步刷新"},
    {id:"1.1-04", dim:"核心流程", pri:"P0", title:"类目分组区按当前筛选命中的三级类目分组，每组只展示增速 TOP3 商品", expect:"分组卡片按三级类目划分；每组最多 3 条，不展示全量榜单"},
    {id:"1.1-05", dim:"核心流程", pri:"P0", title:"商品行表头列序：名次 | 商品 | 品牌 | 价格带 | 支付金额区间 | 环比增速 | 所属类目 | 供需比 | 口径", expect:"列序与 PRD 完全一致；品牌为独立列；含新上榜标记与名次变化"},
    {id:"1.1-06", dim:"核心流程", pri:"P0", title:"增速看板每日刷新：每天重新取一次 7 天累计值写入快照表，看板渲染最新快照", expect:"连续 2 天观察快照表有新行写入；页面「数据截至」日期随之更新；第一天即可出数"},
    {id:"1.1-07", dim:"核心流程", pri:"P0", title:"点击口径徽章弹出该指标口径说明（定义、样本量、数据截止日、来源）", expect:"每个增速数字旁有口径徽章；点击出现弹层，四要素齐全"},
    {id:"1.1-08", dim:"核心流程", pri:"P1", title:"点击商品行展开证据层（两段窗口数值与排名变化明细），证据层内可再展开原始层（来源行与抓取时间）", expect:"三层读法（结论层→证据层→原始层）逐层展开，42 字段不默认平铺"},
    {id:"1.1-09", dim:"核心流程", pri:"P1", title:"点击表头「环比增速」在组内切换升序 / 降序", expect:"排序仅作用于当前分组，不影响其他组"},
    {id:"1.1-10", dim:"核心流程", pri:"P1", title:"切换「市场 / 品类」筛选后，自用结论板块与分组区同步刷新", expect:"「增速最快产品」= 当前筛选范围内环比增速第一的商品；销售国家取 GMV 归属市场"},
    // ---- 1.2 类目增长趋势 ----
    {id:"1.2-01", dim:"核心流程", pri:"P0", title:"类目增长趋势每 7 天刷新，与增速看板的每日节奏不统一", expect:"快照/刷新记录显示该板块 7 天一刷；刷新日数据源未更新时沿用上一期并标注实际截止日"},
    {id:"1.2-02", dim:"核心流程", pri:"P0", title:"趋势表默认仅展示三级类目行（类目名、近 30 天累计支付金额、环比增速、占比、操作）", expect:"三级与四级增速不混排在同一层级；环比直接采用罗盘类目概览自带「较上周期」字段，不自算"},
    {id:"1.2-03", dim:"核心流程", pri:"P0", title:"点开三级类目行，行内展开该级下四级类目（眼霜级）按环比增速降序的排序列表；再次点击收起", expect:"四级类目只在所属三级行展开后出现；排序仅作用于当前层级"},
    {id:"1.2-04", dim:"核心流程", pri:"P0", title:"顶部「增速最快的类目」展示块：近 30 天增速折线图 + 大字号当前增速与近 30 天累计支付金额", expect:"取当前筛选范围内环比增速最高的三级类目；折线为该类目近 30 天日级支付金额序列"},
    {id:"1.2-05", dim:"核心流程", pri:"P0", title:"「看成分」入口联动跳转成分增长榜，并自动带上该类目筛选", expect:"跳转后成分榜筛选条已带出来源类目，可点「×」清除回到大盘口径"},
    {id:"1.2-06", dim:"核心流程", pri:"P1", title:"与增速产品看板筛选联动：从增速看板跳入时自动带出市场/类目筛选", expect:"两页筛选状态一致；切换筛选后顶部展示块与趋势表同步刷新"},
    {id:"1.2-07", dim:"核心流程", pri:"P2", title:"点击「查看趋势」行内展开该类目近 30 天支付金额日级趋势曲线", expect:"行内展开/收起正常；日级数据未接入时折线区标注「占位示意」，不放无意义数字"},
    // ---- 1.3 成分增长榜 ----
    {id:"1.3-01", dim:"核心流程", pri:"P0", title:"成分增长榜每 7 天刷新；筛选条「市场」含「全部」选项", expect:"选「全部」时聚合所有国家的增长成分，并标注来源市场构成"},
    {id:"1.3-02", dim:"核心流程", pri:"P0", title:"榜单列为：排名 / 成分名 / 关联商品数 / 占比 / 环比增速；不含「销售额」「销售量」两列", expect:"列结构与 PRD 一致；占比 = 该成分关联商品数 ÷ 当前筛选范围上榜成分关联商品总数"},
    {id:"1.3-03", dim:"核心流程", pri:"P0", title:"新上榜成分（今天上榜、7 天前未上榜）行首标「新上榜」徽标，单独醒目", expect:"新上榜成分不参与环比排序比较，不与环比数字混排"},
    {id:"1.3-04", dim:"核心流程", pri:"P1", title:"「成分 / 功效」维度 Tab 可切换，榜单在两个口径间刷新", expect:"切换 Tab 后榜单内容、排序随之变化"},
    {id:"1.3-05", dim:"核心流程", pri:"P1", title:"点击成分名展开该成分关联商品简要列表（名称、价格带、所属类目）", expect:"展开/收起正常，列表字段齐全"},
    {id:"1.3-06", dim:"核心流程", pri:"P1", title:"承接类目增长趋势跳入时自动带出类目筛选；点击筛选条「×」清除并恢复大盘一级类目口径", expect:"跳入带筛选、可清除、可恢复，状态不串"}
  ]
},
{
  key:"m2", name:"② 商品榜",
  items:[
    {id:"2.1-01", dim:"核心流程", pri:"P0", title:"来源 Tab：罗盘 / 蝉妈妈 / FastMoss 三个分榜，当前 Tab 高亮，切换后口径徽章同步切换", expect:"三个分榜独立展示；徽章标明来源、周期与「区间值/预估」属性"},
    {id:"2.1-02", dim:"核心流程", pri:"P0", title:"市场与数据源绑定：国内 = 罗盘/蝉妈妈；切换国家/地区到海外 → 榜单自动切换至 FastMoss 数据源；切回国内恢复罗盘/蝉妈妈", expect:"不出现「海外市场 + 罗盘榜」的错位组合；来源 Tab 随市场联动"},
    {id:"2.1-03", dim:"核心流程", pri:"P0", title:"类目级联筛选从一级级联到三级（面部洗护/眼部护理级），可继续级联到四级；榜单按所选层级过滤", expect:"层级过滤正确；筛选路径面包屑保留"},
    {id:"2.1-04", dim:"核心流程", pri:"P0", title:"分榜说明条固定展示「各平台统计周期与口径不同，分榜独立展示、不相加」", expect:"说明条常驻；榜单数字无跨来源合计项"},
    {id:"2.1-05", dim:"核心流程", pri:"P1", title:"榜单表字段：名次、商品名+主图、品牌、价格带、销售额区间、销量区间、关联店铺/达人；各来源列结构随口径略有差异", expect:"字段齐全；罗盘榜为官方区间值，蝉妈妈榜数字标注为预估口径"},

/* ================= 状态管理 ================= */
var LS_KEY = "acceptance-mz-dashboard-v02";
var stateMap = {};   // id -> done/fail/skip（pend 不落库）
var collapsedMap = {}; // moduleKey -> true
var filter = "all";

function loadState(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(raw){
      var obj = JSON.parse(raw);
      stateMap = obj.stateMap || {};
      collapsedMap = obj.collapsedMap || {};
    }
  }catch(e){}
}
function saveState(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({ stateMap: stateMap, collapsedMap: collapsedMap, ts: Date.now() }));
    var h = document.getElementById("saveHint");
    if(h){ h.textContent = "进度已自动保存 · " + new Date().toLocaleTimeString("zh-CN",{hour12:false}); }
  }catch(e){}
}
function getState(id){ return stateMap[id] || "pend"; }
var CYCLE = ["pend","done","fail","skip"]; // 点击三态按钮直接设定，单击当前态 → 回到 pend

/* ================= 渲染 ================= */
var PRI_LABEL = { P0:"P0", P1:"P1", P2:"P2" };
var STATE_LABEL = { pend:"待验收", done:"通过", fail:"未通过", skip:"跳过" };

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function render(){
  var root = document.getElementById("modules");
  root.innerHTML = "";
  var anyVisible = false;

  MODULES.forEach(function(mod){
    var visibleItems = mod.items.filter(function(it){
      if(filter==="all") return true;
      return getState(it.id) === filter;
    });
    // 全部折叠/展开记忆
    var isCollapsed = !!collapsedMap[mod.key];

    var modEl = document.createElement("section");
    modEl.className = "module" + (isCollapsed ? " collapsed" : "");
    modEl.dataset.key = mod.key;

    // 统计
    var st = { done:0, fail:0, skip:0, pend:0 };
    mod.items.forEach(function(it){ st[getState(it.id)]++; });

    var head = document.createElement("div");
    head.className = "module-head";
    head.innerHTML =
      '<span class="caret">▼</span>' +
      '<span class="m-title">' + esc(mod.name) + '</span>' +
      '<span class="m-count">' +
        '<span>共 ' + mod.items.length + ' 项</span>' +
        '<span class="c-done">✅ ' + st.done + '</span>' +
        '<span class="c-fail">❌ ' + st.fail + '</span>' +
        (st.skip ? '<span>⏭️ ' + st.skip + '</span>' : '') +
      '</span>';
    head.addEventListener("click", function(){
      collapsedMap[mod.key] = !collapsedMap[mod.key];
      modEl.classList.toggle("collapsed");
      saveState();
    });
    modEl.appendChild(head);

    var body = document.createElement("div");
    body.className = "module-body";

    if(visibleItems.length === 0){
      if(filter !== "all"){
        var em = document.createElement("div");
        em.className = "empty";
        em.textContent = "本模块暂无「" + STATE_LABEL[filter] + "」状态的验收项";
        body.appendChild(em);
      }
    } else {
      anyVisible = true;
      visibleItems.forEach(function(it){
        body.appendChild(renderItem(it));
      });
    }
    modEl.appendChild(body);
    root.appendChild(modEl);
  });

  if(!anyVisible && filter!=="all"){
    var emAll = document.createElement("div");
    emAll.className = "empty";
    emAll.textContent = "当前筛选「" + STATE_LABEL[filter] + "」下没有任何验收项";
    root.appendChild(emAll);
  }

  updateProgress();
}

function renderItem(it){
  var st = getState(it.id);
  var el = document.createElement("div");
  el.className = "item st-" + st;
  el.dataset.id = it.id;

  var tri = document.createElement("div");
  tri.className = "tri";
  tri.setAttribute("role","group");
  tri.setAttribute("aria-label","验收状态");
  [["done","✅","通过"],["fail","❌","未通过"],["skip","⏭️","跳过"]].forEach(function(cfg){
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = cfg[1];
    b.title = cfg[2] + (st===cfg[0] ? "（再点一次取消）" : "");
    if(st===cfg[0]) b.classList.add("on-"+cfg[0]);
    b.addEventListener("click", function(){
      if(getState(it.id) === cfg[0]) delete stateMap[it.id];  // 再点当前态 → 回到待验收
      else stateMap[it.id] = cfg[0];
      saveState();
      // 若当前在过滤视图且新状态被过滤掉，整树重渲染；否则局部更新即可
      render();
    });
    tri.appendChild(b);
  });

  var main = document.createElement("div");
  main.className = "item-main";
  main.innerHTML =
    '<div class="item-top">' +
      '<span class="item-id">' + esc(it.id) + '</span>' +
      '<span class="pri ' + it.pri.toLowerCase() + '">' + PRI_LABEL[it.pri] + '</span>' +
      '<span class="item-dim">' + esc(it.dim) + '</span>' +
    '</div>' +
    '<div class="item-title">' + esc(it.title) + '</div>' +
    '<div class="item-expect"><span class="tag">预期结果</span>' + esc(it.expect) + '</div>';

  el.appendChild(tri);
  el.appendChild(main);
  return el;
}

/* ================= 进度 ================= */
function updateProgress(){
  var total=0, done=0, fail=0, skip=0, pend=0;
  MODULES.forEach(function(m){ m.items.forEach(function(it){
    total++;
    var s = getState(it.id);
    if(s==="done") done++; else if(s==="fail") fail++; else if(s==="skip") skip++; else pend++;
  });});
  var answered = done+fail+skip;
  var pct = total ? Math.round(done/total*100) : 0;
  document.getElementById("cntTotal").textContent = total;
  document.getElementById("cntPend").textContent = pend;
  document.getElementById("cntDone").textContent = done;
  document.getElementById("cntFail").textContent = fail;
  document.getElementById("cntSkip").textContent = skip;
  document.getElementById("pctText").textContent = pct + "%";
  document.getElementById("doneOverTotal").textContent = "（已验收 " + answered + "/" + total + "）";
  document.getElementById("barDone").style.width = (total?done/total*100:0) + "%";
  document.getElementById("barFail").style.width = (total?fail/total*100:0) + "%";
  document.getElementById("barSkip").style.width = (total?skip/total*100:0) + "%";
}

/* ================= 导出 ================= */
function exportReport(){
  var total=0, done=0, fail=0, skip=0, pend=0;
  var lines = [];
  lines.push("美妆数据看板 · 功能验收报告");
  lines.push("生成时间：" + new Date().toLocaleString("zh-CN",{hour12:false}));
  lines.push("PRD 版本：美妆数据看板-PRD.html v0.2");
  lines.push("");

  MODULES.forEach(function(m){
    lines.push("========================================");
    lines.push(m.name);
    lines.push("----------------------------------------");
    m.items.forEach(function(it){
      total++;
      var s = getState(it.id);
      if(s==="done") done++; else if(s==="fail") fail++; else if(s==="skip") skip++; else pend++;
      var mark = {done:"[✅ 通过]", fail:"[❌ 未通过]", skip:"[⏭️ 跳过]", pend:"[⬜ 待验收]"}[s];
      lines.push(mark + " " + it.id + "（" + it.pri + " · " + it.dim + "）" + it.title);
      lines.push("    预期结果：" + it.expect);
    });
    lines.push("");
  });

  lines.push("========================================");
  lines.push("汇总：总数 " + total + " ｜ 通过 " + done + " ｜ 未通过 " + fail + " ｜ 跳过 " + skip + " ｜ 待验收 " + pend);
  lines.push("通过率：" + (total ? Math.round(done/total*100) : 0) + "%（按总项数计）");

  var blob = new Blob([lines.join("\n")], {type:"text/plain;charset=utf-8"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "美妆数据看板-验收报告-" + new Date().toISOString().slice(0,10) + ".txt";
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 400);
  toast("验收报告已导出");
}

/* ================= 工具 ================= */
var toastTimer = null;
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2200);
}

/* ================= 事件绑定 ================= */
document.getElementById("filterSeg").addEventListener("click", function(e){
  var b = e.target.closest("button[data-f]");
  if(!b) return;
  filter = b.dataset.f;
  this.querySelectorAll("button").forEach(function(x){ x.classList.toggle("active", x===b); });
  render();
});
document.getElementById("expandAll").addEventListener("click", function(){
  collapsedMap = {};
  document.querySelectorAll(".module").forEach(function(m){ m.classList.remove("collapsed"); });
  saveState();
});
document.getElementById("collapseAll").addEventListener("click", function(){
  MODULES.forEach(function(m){ collapsedMap[m.key] = true; });
  document.querySelectorAll(".module").forEach(function(m){ m.classList.add("collapsed"); });
  saveState();
});
document.getElementById("resetBtn").addEventListener("click", function(){
  if(!confirm("确定清空全部验收进度？此操作不可撤销。")) return;
  stateMap = {};
  saveState();
  render();
  toast("已清空进度");
});
document.getElementById("exportBtn").addEventListener("click", exportReport);

/* ================= 启动 ================= */
loadState();
render();
</script>
