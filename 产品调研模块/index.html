function applyWall(){
  var q=(document.getElementById('q').value||'').trim().toLowerCase();

    return b.sortkey[mode]-a.sortkey[mode];
  });
  var box=document.getElementById('grid'), n=0;
  arr.forEach(function(p){
    var s=(p.title+' '+p.brand+' '+p.shop+' '+p.sellingPoint+' '+p.audienceLine+' '+p.cate).toLowerCase();

}

   +'<tr><td><b>爆品视频拆解</b><br>《产品AI工作流》3.2</td>'
   +'<td>每个链接 TOP'+Math.max.apply(null,P.map(function(p){return p.viral.length}))+' 视频，逐条 <b>折叠</b>。点开后：<b>① 8 列表</b>＝时长 / 开头（钩子）/ 打什么痛点 / 核心卖点 / 目标人群 / 使用场景 / 框架类型 / 分析（亮点·转化点·爆点），痛点与卖点<b>直接引用文案原句</b>，不靠词库猜；<b>② 文案逐句拆解表</b>＝每句原文 + 类型（钩子/痛点/功效/成分/人群/场景/背书/转化）+ 在干什么；<b>③ 文案原文 + 抖音原视频直链</b>。另有「内容总结」板块统计该链接全部视频。筛除明星大V(&gt;100万粉)、品牌自营号、9.9 福利款</td>'
   +'<td>飞瓜「带货视频」loadAwemeAnalysis（按预估销售额降序）。<b>缺口：拆解依据是视频标题文案+实测时长+达人层级+词库映射，未做 ASR 逐句口播</b>（要用 Whisper 之类的语音转写才能到逐句级）</td></tr>'
   +'<tr><td><b>竞品对标</b><br>《竞品分析2》</td>'
   +'<td>全品对标表：30 个链接 × 18 列横向对比</td>'
   +'<td><b>缺口：配赠、工厂两列飞瓜没有</b></td></tr>'
   +'</table>');
}
</script>
<script>
/* ---------------- 路由 ---------------- */
function route(){
  var h=location.hash||'#/';
  var m=h.match(/^#\/p\/(\d+)/);
  if(h.indexOf('#/cmp')===0){ renderCmp(); }
  else if(h.indexOf('#/method')===0){ renderMethod(); }
  else if(m){ renderDetail(parseInt(m[1],10)); }
  else { renderWall(); }
  if(/#(quick|core|shelf|visual|cmp2|aud|rev|viral|vsum|tal)$/.test(h)){
    var id=h.split('#').pop();
    var el=document.getElementById(id);
    if(el){
      if(el.tagName==='DETAILS') el.open = true;      /* 锚点跳转自动展开该板块 */
      setTimeout(function(){el.scrollIntoView({behavior:'smooth',block:'start'})},70);
    }
  } else { window.scrollTo(0,0); }
}
window.addEventListener('hashchange',route);
route();
</script>
